name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Test Suite
        run: |
          make test

  multi-distro-matrix:
    name: Multi-Distro Verification (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'debian:bookworm-slim'
          - 'debian:sid-slim'
          - 'ubuntu:24.04'
          - 'ubuntu:22.04'
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Runtime Build Dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 make binutils tar gzip git iputils-ping sudo
          git config --global --add safe.directory "*" || true

      - name: Execute Test Suite
        run: |
          make test

      - name: Verify Package Build
        run: |
          make deb
          test -f dist/aero-linux_*.deb || (echo "Debian package not found" && exit 1)

  package-build:
    name: Debian Package Build & Artifact Check
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Debian Package
        run: |
          make deb

      - name: Verify .deb Artifact
        run: |
          ls -la dist/
          test -f dist/aero-linux_*.deb || (echo "Debian package not found" && exit 1)
